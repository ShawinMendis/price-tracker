name: track
on:
  schedule:
    - cron: "23 6 * * *"   # daily, UTC (off the top of the hour: GitHub delays those)
  workflow_dispatch:
permissions:
  contents: write   # commit prices.db
  pages: write
  id-token: write
concurrency:
  group: track
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tracker.py scrape
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: python tracker.py report
      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.db
          git diff --cached --quiet || git commit -m "prices $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
